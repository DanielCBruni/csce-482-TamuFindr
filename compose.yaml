services:
  app-prod-standalone:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    image: tamufindr:prod
    container_name: tamufindr-app-prod
    ports:
      - "3000:3000"

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: tamufindr:dev
    container_name: tamufindr-app-dev
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      - DATABASE_URL=postgresql://tamufindr:tamufindr@db:5432/tamufindr
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json

  db:
    image: postgres:18
    container_name: tamufindr-db
    environment:
      POSTGRES_PASSWORD: tamufindr
      POSTGRES_USER: tamufindr
      POSTGRES_DB: tamufindr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamufindr -d tamufindr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
