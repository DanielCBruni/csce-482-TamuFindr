services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: tamufindr:dev
    container_name: tamufindr-app-dev
    ports:
      - '3000:3000'
    environment:
      - WATCHPACK_POLLING=true
      - DATABASE_URL=postgresql://tamufindr:tamufindr@db:5432/tamufindr
      - DEFAULT_USER_ID=sample-user-id
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json

  db:
    image: postgres:18
    container_name: tamufindr-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
